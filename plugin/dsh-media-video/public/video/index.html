<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="dsh-studio-version" content="__DSH_STUDIO_VERSION__">
  <title>视频剪辑工作台</title>
  <link rel="stylesheet" href="video.css">
</head>
<body class="minimal-editor">
  <header class="topbar">
    <a class="brand" href="#">帧间 <span>VIDEO STUDIO</span></a>
    <span class="studio-version" id="studioVersion" title="编辑器版本（来自 package.json）">v__DSH_STUDIO_VERSION__</span>
    <div class="project-name"><strong id="projectName">未命名工程</strong><small id="revisionLabel">修订 0 · 未保存</small></div>
    <div class="top-actions">
    <button type="button" id="exportQuick" class="export-btn export-quick">导出 WebM</button>
      <details class="io-menu"><summary>导入</summary><div class="io-options"><label class="icon-btn">视频文件<input id="videoInput" type="file" accept="video/*" hidden></label><button class="icon-btn" id="openProject">打开工程</button><label class="icon-btn">叠加图片<input id="overlayImageInput" type="file" accept="image/*" hidden></label></div></details>
      <input id="projectInput" type="file" accept="application/json,.json" hidden>
      <details class="io-menu"><summary>导出</summary><div class="io-options"><button class="icon-btn" id="saveProject">保存工程</button><button class="export-btn" id="exportVideo" disabled>导出 WebM</button><span class="unavailable">MP4 未验证</span></div></details>
    </div>
  </header>
  <main class="workspace">
    <section class="viewer-column">
      <div class="viewer-head"><div><span class="eyebrow">预览</span><span id="mediaLabel">尚未导入媒体</span></div><span class="live-state"><i></i><span id="capabilityLabel">本地编辑</span></span></div>
      <div class="stage" id="stage">
        <video id="video" playsinline></video>
        <canvas id="overlayCanvas"></canvas>
        <div class="empty-stage" id="emptyStage"><div class="clapper">▰</div><strong>从本地导入一个视频</strong><span>视频只在当前浏览器中预览，不会上传</span><label class="primary-btn">选择视频<input id="emptyVideoInput" type="file" accept="video/*" hidden></label></div>
      </div>
      <div class="transport">
        <div class="transport-left"><button id="play" class="round-btn" title="播放">▶</button><span class="timecode" id="timecode">00:00.00 <em>/</em> 00:00.00</span></div>
        <div class="transport-right"><button id="undo" class="tool-btn" title="撤销" disabled>↶</button><button id="redo" class="tool-btn" title="重做" disabled>↷</button><span class="divider"></span><button id="addText" class="tool-btn" aria-label="添加文字">T <span>文字</span></button><label class="tool-btn" aria-label="添加图片">▧ <span>图片</span><input id="imageInput" type="file" accept="image/*" hidden></label></div>
      </div>
      <div class="overlay-composer" id="overlayComposer" hidden>
        <input id="overlayText" type="text" placeholder="输入叠加文字，回车添加" aria-label="叠加文字内容">
        <button id="overlayAdd" class="export-btn" aria-label="添加文字叠加">添加</button>
      </div>
      <input id="scrubber" type="range" min="0" max="1000" value="0" aria-label="播放进度">
      <div class="timeline-head"><div class="timeline-title">时间轴 <span id="durationLabel">00:00</span></div><div class="timeline-tools"><button id="addVideoTrack" class="text-btn">＋ 视频轨</button><button id="addAudioTrack" class="text-btn">＋ 音频轨</button><button id="addTextTrack" class="text-btn">＋ 字幕轨</button><button id="removeClip" class="text-btn" disabled>删除片段</button><span class="divider"></span><button id="zoomOut" class="tool-btn">−</button><button id="zoomIn" class="tool-btn">＋</button></div></div>
      <div class="timeline" id="timeline">
        <div class="ruler" id="ruler"></div>
        <div class="track-list" id="trackList"></div>
        <div id="overlayLane" hidden></div>
        <div class="playhead" id="playhead"><i></i></div>

      </div>
    </section>
    <aside class="inspector">
      <div class="inspector-body">
      <div class="panel-heading"><div><span class="eyebrow">工程状态</span><h2>检查器</h2></div><span class="revision-pill" id="revisionPill">R0</span></div>
      <div class="inspector-section"><h3>片段</h3><div class="property-row"><span>媒体</span><strong id="sourceName">未导入</strong></div><div class="property-row"><span>入点</span><strong id="inValue">—</strong></div><div class="property-row"><span>出点</span><strong id="outValue">—</strong></div><div class="property-row"><span>长度</span><strong id="lengthValue">—</strong></div><input aria-label="片段入点" id="inPoint" type="range" min="0" max="100" value="0"><input aria-label="片段出点" id="outPoint" type="range" min="0" max="100" value="100"></div>
      <div class="inspector-section"><div class="section-title"><h3>叠加对象</h3><span id="overlayCount">0</span></div><div id="overlayList" class="overlay-list"><div class="empty-list">还没有叠加对象</div></div></div>
      <div class="inspector-section"><div class="section-title"><h3>审计</h3><span class="safe-dot">真实回执</span></div><div class="audit-box"><span>最近操作</span><code id="auditDigest">等待操作</code></div><p class="capability-note">对话与审批在右侧 DSH 面板，本页不提供模拟入口。</p></div>
      <div class="inspector-section capability-section"><h3>导出能力</h3><div class="property-row"><span>WebM</span><strong id="webmCapability">检测中</strong></div><div class="property-row"><span>MP4</span><strong class="unknown">未验证</strong></div><div class="capability-note">媒体文件不经过协作中继。工程快照只保存媒体引用。</div></div>
      <button class="read-state-btn" id="readState">读取工程状态</button>
      </div>
    </aside>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="mediaPool" hidden></div>
  <script type="module" src="video.js"></script>
</body>
</html>
